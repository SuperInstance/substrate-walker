<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Substrate Walker — 3D View</title>
<link rel="stylesheet" href="style.css">
<style>
  body { margin: 0; }
  canvas { display: block; }
  #info { 
    position: fixed; top: 10px; left: 10px; 
    background: rgba(0,0,0,0.7); padding: 10px; 
    font-size: 12px; color: #4af; max-width: 300px;
  }
</style>
</head>
<body>
<canvas id="canvas3d"></canvas>
<div id="info">
<h3>Substrate Walker — 3D</h3>
<p>Click + drag to rotate. Scroll to zoom.</p>
<p>Cells rendered as 3D pillars. Heights from cell density array.</p>
<p>Lorres fire at critical moments (frontal cortex).</p>
<p id="fps">FPS: 0</p>
<p id="selected">Selected: (0, 0) hash: -</p>
</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

// Scene
const canvas = document.getElementById('canvas3d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x0a0a14);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(20, 30, 30);
camera.lookAt(15, 0, 15);

// Lights
const ambient = new THREE.AmbientLight(0x4444ff, 0.6);
scene.add(ambient);

const dirLight = new THREE.DirectionalLight(0xff80ff, 1);
dirLight.position.set(20, 50, 20);
scene.add(dirLight);

const dirLight2 = new THREE.DirectionalLight(0x80ffff, 0.5);
dirLight2.position.set(-20, 30, -10);
scene.add(dirLight2);

// Generate the city (heightmap-based 3D pillars)
const citySize = 32;
const heights = [];  // Will be populated from real substrate data

// Mock heights for demo (replace with real data from WASM)
for (let z = 0; z < citySize; z++) {
    heights.push([]);
    for (let x = 0; x < citySize; x++) {
        // Pseudo-random heights based on x,z position
        const h = Math.max(0, Math.sin(x * 0.7) * Math.cos(z * 0.5) * 5 + 
                          Math.sin(x * 1.3 + z * 0.8) * 3 + 4);
        heights[z].push(h);
    }
}

// Render cells as 3D pillars
const colors = [0x4af, 0xfa4, 0xaf4, 0xf4a, 0xa4f, 0xf44];
const cellGroup = new THREE.Group();
const cellMeshes = [];

for (let z = 0; z < citySize; z++) {
    for (let x = 0; x < citySize; x++) {
        const h = heights[z][x];
        if (h > 0.1) {
            const geometry = new THREE.BoxGeometry(0.6, h, 0.6);
            const color = colors[(x * 7 + z * 13) % colors.length];
            const material = new THREE.MeshPhongMaterial({
                color: color,
                transparent: true,
                opacity: 0.85,
                shininess: 100,
            });
            const pillar = new THREE.Mesh(geometry, material);
            pillar.position.set(x, h / 2, z);
            pillar.userData = { x, z, h, hash: '0x' + (x * 1000 + z).toString(16).padStart(16, '0') };
            cellGroup.add(pillar);
            cellMeshes.push(pillar);
        }
    }
}

scene.add(cellGroup);

// Ground plane
const groundGeo = new THREE.PlaneGeometry(50, 50);
const groundMat = new THREE.MeshPhongMaterial({ color: 0x0a0a14, shininess: 0 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// Grid lines
const gridSize = 32;
const gridDivisions = 32;
const gridHelper = new THREE.GridHelper(gridSize, gridDivisions, 0x4af, 0x222244);
gridHelper.position.set(15.5, 0, 15.5);
scene.add(gridHelper);

// Controls
const mouseDown = false;
let mouseX = 0, mouseY = 0;
let rotY = 0, rotX = 0.5;
let zoom = 50;

canvas.addEventListener('mousedown', () => { /* tracking */ });
canvas.addEventListener('mousemove', (e) => {
    if (e.buttons === 1) {
        rotY += (e.clientX - mouseX) * 0.01;
        rotX += (e.clientY - mouseY) * 0.01;
        rotX = Math.max(0.1, Math.min(1.5, rotX));
    }
    mouseX = e.clientX;
    mouseY = e.clientY;
});
canvas.addEventListener('wheel', (e) => {
    zoom *= e.deltaY > 0 ? 1.1 : 0.9;
    zoom = Math.max(15, Math.min(100, zoom));
});

// Raycaster for cell selection
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

canvas.addEventListener('click', (e) => {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(cellMeshes);
    if (intersects.length > 0) {
        const hit = intersects[0].object;
        const { x, z, h, hash } = hit.userData;
        document.getElementById('selected').textContent = `Selected: (${x}, ${z}) height=${h.toFixed(2)} hash=${hash}`;
        // Flash the selected cell
        hit.material.emissive.setHex(0x444444);
        setTimeout(() => hit.material.emissive.setHex(0x000000), 300);
    }
});

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Render loop
let lastTime = 0;
let frames = 0;
function animate(now) {
    requestAnimationFrame(animate);
    const dt = (now - lastTime) / 1000;
    lastTime = now;
    frames++;
    if (frames % 60 === 0) {
        document.getElementById('fps').textContent = `FPS: ${Math.round(1 / dt)}`;
    }

    // Animate camera around scene
    camera.position.x = 20 * Math.cos(rotY) * zoom / 30;
    camera.position.z = 20 * Math.sin(rotY) * zoom / 30;
    camera.position.y = zoom / 2;
    camera.lookAt(15, 4, 15);

    // Pulse cells slightly
    const t = now * 0.001;
    for (const m of cellMeshes) {
        const base = m.userData.h;
        m.scale.y = 1 + Math.sin(t + m.userData.x + m.userData.z) * 0.02;
    }

    renderer.render(scene, camera);
}
animate(0);
</script>
</body>
</html>
